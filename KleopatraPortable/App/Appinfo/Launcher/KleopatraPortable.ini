[Launch]
ProgramExecutable=Kleopatra\bin\kleopatra.exe
SinglePortableAppInstance=True

[Environment]
HOME=%PAL:AppDir%\GnuPG
GNUPGHOME=%PAL:DataDir%\.gnupg

[DirectoriesCleanupForce]
1=%APPDATA%\gnupg
2=%LOCALAPPDATA%\gnupg

[FileWrite1]
Type=INI
File=%PAL:AppDir%\Kleopatra\bin\qt.conf
Section=StandardPaths
Key=AppConfigLocation
Value=%PAL:DataDir:Forwardslash%/::APPNAME::

[FileWrite2]
Type=INI
File=%PAL:AppDir%\Kleopatra\bin\qt.conf
Section=StandardPaths
Key=AppDataLocation
Value=%PAL:DataDir:Forwardslash%/::APPNAME::

[FileWrite3]
Type=INI
File=%PAL:AppDir%\Kleopatra\bin\qt.conf
Section=StandardPaths
Key=AppLocalDataLocation
Value=%PAL:DataDir:Forwardslash%/::APPNAME::

[FileWrite4]
Type=INI
File=%PAL:AppDir%\Kleopatra\bin\qt.conf
Section=StandardPaths
Key=CacheLocation
Value=%PAL:DataDir:Forwardslash%/::APPNAME::/cache

[FileWrite5]
Type=INI
File=%PAL:AppDir%\Kleopatra\bin\qt.conf
Section=StandardPaths
Key=ConfigLocation
Value=%PAL:DataDir:Forwardslash%/::APPNAME::

[FileWrite6]
Type=INI
File=%PAL:AppDir%\Kleopatra\bin\qt.conf
Section=StandardPaths
Key=StateLocation
Value=%PAL:DataDir:Forwardslash%/::APPNAME::/State

[FileWrite7]
Type=INI
File=%PAL:AppDir%\Kleopatra\bin\qt.conf
Section=StandardPaths
Key=GenericCacheLocation
Value=%PAL:DataDir:Forwardslash%/::APPNAME::/cache

[FileWrite8]
Type=INI
File=%PAL:AppDir%\Kleopatra\bin\qt.conf
Section=StandardPaths
Key=GenericConfigLocation
Value=%PAL:DataDir:Forwardslash%/::APPNAME::

[FileWrite9]
Type=INI
File=%PAL:AppDir%\Kleopatra\bin\qt.conf
Section=StandardPaths
Key=GenericDataLocation
Value=%PAL:DataDir:Forwardslash%/::APPNAME::

[FileWrite10]
Type=INI
File=%PAL:AppDir%\Kleopatra\bin\qt.conf
Section=StandardPaths
Key=GenericStateLocation
Value=%PAL:DataDir:Forwardslash%/::APPNAME::/State